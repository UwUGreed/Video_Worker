<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <style>
    html, body { margin:0; padding:0; background:#F0E0D6; }
    .frame {
      width:1080px;
      padding:64px 64px 96px 64px;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
      color:#789922;
    }
    h1 {
      margin:0 0 28px 0;
      font-size:72px;
      letter-spacing:1px;
      text-transform:uppercase;
    }
    pre {
      margin:0;
      font-size:42px;
      line-height:1.25;
      white-space:pre-wrap;
      word-wrap:break-word;
    }
  </style>
</head>
<body>
  <div class="frame">
    <h1 id="title"></h1>
    <pre id="body"></pre>
  </div>
</body>
</html>
