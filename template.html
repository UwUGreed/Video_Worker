<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <style>
    :root {
      --bg-top: #617387;
      --bg-mid: #93818d;
      --bg-bottom: #f1e0cd;
      --post-bg: rgba(240, 224, 214, 0.9);
      --post-border: rgba(217, 191, 183, 0.95);
      --name: #117743;
      --meta: #707070;
      --title: #0f0c5d;
      --text: #789922;
      --greentext: #789922;
      --file: #1f2937;
      --placeholder-bg: linear-gradient(135deg, #f6eadf 0%, #e8d4c3 100%);
      --placeholder-fg: #6b4f3c;
      --frame-shadow: rgba(68, 48, 43, 0.12);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 42%, var(--bg-bottom) 100%);
    }
    body {
      position: relative;
      isolation: isolate;
      width: 1080px;
      height: auto;
      overflow-y: auto;
      padding: 40px 28px 120px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .scene-sky,
    .scene-haze,
    .scene-window,
    .scene-moon,
    .scene-cityline,
    .scene-desk,
    .scene-grain {
      position: absolute;
    }

    .scene-sky {
      inset: 0;
      background:
        radial-gradient(circle at 18% 16%, rgba(255, 211, 158, 0.22) 0%, rgba(255, 211, 158, 0.08) 12%, transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(255, 247, 224, 0.14) 0%, rgba(255, 247, 224, 0.05) 8%, transparent 18%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 44%, var(--bg-bottom) 100%);
    }

    .scene-haze {
      inset: -12%;
      background:
        radial-gradient(circle at 12% 24%, rgba(255, 181, 126, 0.18) 0%, transparent 26%),
        radial-gradient(circle at 68% 26%, rgba(255, 229, 194, 0.12) 0%, transparent 18%),
        radial-gradient(circle at 46% 78%, rgba(211, 149, 124, 0.14) 0%, transparent 30%);
      filter: blur(34px);
      opacity: 0.9;
      animation: slow-drift 18s ease-in-out infinite alternate;
    }

    .scene-window {
      top: 58px;
      right: 54px;
      width: 312px;
      height: 224px;
      border: 14px solid rgba(83, 65, 59, 0.16);
      border-bottom-width: 18px;
      background:
        linear-gradient(90deg, transparent 49%, rgba(83, 65, 59, 0.16) 49%, rgba(83, 65, 59, 0.16) 51%, transparent 51%),
        linear-gradient(180deg, transparent 48%, rgba(83, 65, 59, 0.16) 48%, rgba(83, 65, 59, 0.16) 52%, transparent 52%),
        linear-gradient(180deg, rgba(113, 130, 152, 0.24) 0%, rgba(162, 128, 132, 0.2) 58%, rgba(236, 205, 176, 0.16) 100%);
      box-shadow:
        0 24px 50px rgba(44, 31, 36, 0.08),
        inset 0 0 0 1px rgba(255, 255, 255, 0.14);
      opacity: 0.7;
      transform: rotate(-1.2deg);
    }

    .scene-moon {
      top: 88px;
      right: 156px;
      width: 118px;
      height: 118px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 36% 36%, rgba(255, 252, 242, 0.98) 0%, rgba(253, 233, 188, 0.92) 44%, rgba(253, 233, 188, 0.3) 67%, rgba(253, 233, 188, 0) 75%);
      box-shadow: 0 0 58px rgba(250, 231, 183, 0.22);
      opacity: 0.85;
      animation: float-moon 12s ease-in-out infinite;
    }

    .scene-cityline {
      left: -4%;
      right: -4%;
      bottom: 108px;
      height: 188px;
      background:
        linear-gradient(180deg, rgba(52, 39, 46, 0) 0%, rgba(52, 39, 46, 0.18) 34%, rgba(52, 39, 46, 0.52) 100%);
      clip-path: polygon(
        0 100%, 0 72%, 5% 72%, 5% 58%, 9% 58%, 9% 76%, 14% 76%, 14% 44%, 18% 44%, 18% 70%,
        23% 70%, 23% 50%, 28% 50%, 28% 80%, 33% 80%, 33% 40%, 37% 40%, 37% 65%, 42% 65%,
        42% 54%, 47% 54%, 47% 77%, 52% 77%, 52% 36%, 56% 36%, 56% 62%, 61% 62%, 61% 48%,
        66% 48%, 66% 73%, 71% 73%, 71% 41%, 75% 41%, 75% 68%, 80% 68%, 80% 56%, 85% 56%,
        85% 78%, 91% 78%, 91% 46%, 96% 46%, 96% 64%, 100% 64%, 100% 100%
      );
      opacity: 0.42;
    }

    .scene-desk {
      left: -6%;
      right: -6%;
      bottom: 0;
      height: 158px;
      background:
        radial-gradient(circle at 50% -10%, rgba(255, 201, 146, 0.14) 0%, rgba(255, 201, 146, 0.02) 24%, transparent 42%),
        linear-gradient(180deg, rgba(87, 61, 51, 0) 0%, rgba(87, 61, 51, 0.16) 18%, rgba(87, 61, 51, 0.54) 100%);
      box-shadow: 0 -36px 88px rgba(61, 42, 36, 0.12);
    }

    .scene-grain {
      inset: -50%;
      background-image: radial-gradient(rgba(255, 255, 255, 0.09) 0.7px, transparent 0.7px);
      background-size: 24px 24px;
      opacity: 0.14;
      mix-blend-mode: soft-light;
      animation: grain-shift 10s steps(4) infinite;
    }

    .thread-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .board-bar {
      padding: 16px 20px;
      border: 1px solid #c5cedf;
      background: linear-gradient(180deg, rgba(247, 237, 220, 0.92) 0%, rgba(234, 214, 197, 0.86) 100%);
      color: #800000;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: 0 16px 34px var(--frame-shadow);
      backdrop-filter: blur(6px);
    }

    .post {
      width: 100%;
      border: 1px solid var(--post-border);
      background: var(--post-bg);
      padding: 22px 22px 30px;
      box-shadow:
        0 18px 40px var(--frame-shadow),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(6px);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: baseline;
      margin-bottom: 16px;
      font-size: 28px;
      line-height: 1.25;
    }

    .name {
      color: var(--name);
      font-weight: 700;
    }

    .subject {
      color: var(--title);
      font-weight: 700;
    }

    .details {
      color: var(--meta);
    }

    .content {
      display: flow-root;
    }

    .media {
      float: left;
      width: 240px;
      margin: 6px 22px 16px 0;
    }

    .fileline {
      margin-bottom: 8px;
      color: var(--file);
      font-size: 20px;
      line-height: 1.3;
    }

    .thumb {
      width: 240px;
      height: 240px;
      border: 1px solid #b99987;
      background: var(--placeholder-bg);
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      position: relative;
      z-index: 1;
    }

    .thumb::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(45deg, rgba(255,255,255,0.18) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.18) 50%, rgba(255,255,255,0.18) 75%, transparent 75%, transparent);
      background-size: 44px 44px;
      opacity: 0.6;
    }

    .thumb-label {
      position: relative;
      z-index: 1;
      padding: 14px;
      text-align: center;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 700;
      color: var(--placeholder-fg);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .body {
      font-size: 34px;
      line-height: 1.34;
      color: var(--greentext);
    }

    .line {
      display: block;
      white-space: pre-wrap;
      word-wrap: break-word;
      color: var(--greentext);
    }

    @keyframes slow-drift {
      0% { transform: translate3d(-2%, 0, 0) scale(1); }
      100% { transform: translate3d(2%, -1.5%, 0) scale(1.04); }
    }

    @keyframes float-moon {
      0% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
      100% { transform: translateY(0); }
    }

    @keyframes grain-shift {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-2%, 1%); }
      50% { transform: translate(1%, -1%); }
      75% { transform: translate(-1%, -2%); }
      100% { transform: translate(0, 0); }
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="scene-sky"></div>
    <div class="scene-haze"></div>
    <div class="scene-window"></div>
    <div class="scene-moon"></div>
    <div class="scene-cityline"></div>
    <div class="scene-desk"></div>
    <div class="scene-grain"></div>
  </div>
  <div class="thread-shell">
    <div class="board-bar">/x/ - auto thread capture</div>
    <article class="post">
      <div class="meta">
        <span class="name">Anonymous</span>
        <span class="subject" id="title">Story</span>
        <span class="details">04/02/26(Fri)12:00:00 No.427001337</span>
      </div>
      <div class="content">
        <div class="media">
          <div class="fileline">File: placeholder.jpg (280 KB, 280x280)</div>
          <div class="thumb">
            <img id="post-image" alt="Post image" />
            <div id="image-placeholder" class="thumb-label">Image Placeholder</div>
          </div>
        </div>
        <div id="body" class="body"></div>
      </div>
    </article>
  </div>
</body>
</html>
